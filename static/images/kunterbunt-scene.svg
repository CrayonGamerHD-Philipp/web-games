<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="t">
  <title id="t">Kunterbunt: ein Fächer aus farbigen Karten auf dem Tisch</title>
  <defs>
    <g id="frame"><rect x="-108" y="-151" width="216" height="302" rx="16" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-width="4"/></g>
    <g id="disc">
      <path d="M0 0V-64A64 64 0 0 0 -64 0Z" fill="#c8435a"/>
      <path d="M0 0V-64A64 64 0 0 1 64 0Z" fill="#e8b23e"/>
      <path d="M0 0H64A64 64 0 0 1 0 64Z" fill="#3a74b8"/>
      <path d="M0 0V64A64 64 0 0 1 -64 0Z" fill="#4a9a66"/>
      <path d="M0 -64V64M-64 0H64" stroke="#23262e" stroke-width="5"/>
    </g>
  </defs>

  <!-- calm ground -->
  <rect width="1536" height="1024" fill="#eef0eb"/>
  <ellipse cx="768" cy="842" rx="560" ry="64" fill="#dfe3db"/>

  <!-- fan: back to front -->
  <g transform="translate(768 900)">
    <!-- back of a card, far left -->
    <g transform="rotate(-34) translate(0 -330)">
      <rect x="-122" y="-170" width="244" height="340" rx="24" fill="#20232b"/>
      <rect x="-108" y="-156" width="216" height="312" rx="16" fill="none" stroke="#f6f3ea" stroke-opacity="0.22" stroke-width="4"/>
      <g transform="rotate(-8)">
        <rect x="-62" y="-62" width="124" height="124" rx="30" fill="#f6f3ea" fill-opacity="0.06"/>
        <circle cx="-24" cy="-24" r="17" fill="#d4566b"/>
        <path d="M24 -43 43 -7H5Z" fill="#ecbb50"/>
        <rect x="-41" y="7" width="34" height="34" rx="5" fill="#5aa874"/>
        <path d="M24 5 43 24 24 43 5 24Z" fill="#4f88cc"/>
      </g>
    </g>

    <!-- Wiese 7 -->
    <g transform="rotate(-17) translate(0 -340)" color="#f4fbf3">
      <rect x="-122" y="-170" width="244" height="340" rx="24" fill="#357a50"/>
      <rect x="-108" y="-156" width="216" height="312" rx="16" fill="none" stroke="#f4fbf3" stroke-opacity="0.32" stroke-width="4"/>
      <text x="0" y="52" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-weight="600" font-size="150" fill="#f4fbf3" letter-spacing="-6">7</text>
      <text x="-86" y="-108" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-weight="600" font-size="48" fill="#f4fbf3">7</text>
      <rect x="-98" y="-92" width="24" height="24" rx="3" fill="#f4fbf3"/>
    </g>

    <!-- Kirsche +2 -->
    <g transform="rotate(0) translate(0 -350)">
      <rect x="-122" y="-170" width="244" height="340" rx="24" fill="#b8364d"/>
      <rect x="-108" y="-156" width="216" height="312" rx="16" fill="none" stroke="#fff8f4" stroke-opacity="0.32" stroke-width="4"/>
      <text x="0" y="44" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-weight="600" font-size="118" fill="#fff8f4" letter-spacing="-6">+2</text>
      <text x="-84" y="-108" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-weight="600" font-size="44" fill="#fff8f4">+2</text>
      <circle cx="-84" cy="-78" r="13" fill="#fff8f4"/>
    </g>

    <!-- Meer Richtungswechsel -->
    <g transform="rotate(17) translate(0 -340)">
      <rect x="-122" y="-170" width="244" height="340" rx="24" fill="#2e66aa"/>
      <rect x="-108" y="-156" width="216" height="312" rx="16" fill="none" stroke="#f3f7ff" stroke-opacity="0.32" stroke-width="4"/>
      <g transform="translate(-66 -66) scale(5.5)" fill="none" stroke="#f3f7ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 8h15M15 4.5 18.5 8 15 11.5"/>
        <path d="M20.5 16h-15M9 12.5 5.5 16 9 19.5"/>
      </g>
      <path d="M-86 -130 -70 -114 -86 -98 -102 -114Z" fill="#f3f7ff"/>
    </g>

    <!-- Farbwunsch -->
    <g transform="rotate(34) translate(0 -330)">
      <rect x="-122" y="-170" width="244" height="340" rx="24" fill="#23262e"/>
      <rect x="-108" y="-156" width="216" height="312" rx="16" fill="none" stroke="#f6f3ea" stroke-opacity="0.32" stroke-width="4"/>
      <use href="#disc" transform="scale(1.15)"/>
      <use href="#disc" transform="translate(-84 -114) scale(0.3)"/>
    </g>
  </g>

  <!-- Sonne 4, lying on the table -->
  <g transform="translate(1180 760) rotate(-74)">
    <rect x="-90" y="-126" width="180" height="252" rx="18" fill="#e3a832"/>
    <rect x="-79" y="-115" width="158" height="230" rx="12" fill="none" stroke="#2e2003" stroke-opacity="0.3" stroke-width="3"/>
    <text x="0" y="38" text-anchor="middle" font-family="Instrument Sans, Arial, sans-serif" font-weight="600" font-size="110" fill="#2e2003" letter-spacing="-4">4</text>
    <path d="M-62 -100 -48 -76H-76Z" fill="#2e2003"/>
  </g>
</svg>
